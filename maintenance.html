<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GoBee | Em Breve</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --secondary: #818cf8;
            --bg: #030712;
            --card-bg: rgba(17, 24, 39, 0.7);
            --text: #f8fafc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 20% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(129, 140, 248, 0.15) 0%, transparent 40%);
        }

        .container {
            text-align: center;
            padding: 4rem;
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 800px;
            width: 90%;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            margin-bottom: 2rem;
        }

        .logo-img {
            max-width: 250px;
            height: auto;
            /* White mask filter: makes dark/black logos white */
            filter: brightness(0) invert(1);
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            font-weight: 400;
        }

        p {
            font-size: 1.25rem;
            color: #94a3b8;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .loader {
            width: 100px;
            height: 4px;
            background: rgba(255, 255, 255, 0.1);
            margin: 0 auto;
            border-radius: 2px;
            overflow: hidden;
        }

        .loader::after {
            content: '';
            display: block;
            width: 40%;
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            animation: move 2s infinite ease-in-out;
        }

        @keyframes move {
            0% {
                transform: translateX(-150%);
            }

            100% {
                transform: translateX(250%);
            }
        }

        .footer {
            position: absolute;
            bottom: 2rem;
            color: #475569;
            font-size: 0.875rem;
        }

        .floating-circles div {
            position: absolute;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            filter: blur(60px);
            opacity: 0.1;
            z-index: 1;
        }

        .circle-1 {
            width: 300px;
            height: 300px;
            top: -150px;
            left: -150px;
        }

        .circle-2 {
            width: 400px;
            height: 400px;
            bottom: -200px;
            right: -200px;
        }
    </style>
</head>

<body>
    <div class="floating-circles">
        <div class="circle-1"></div>
        <div class="circle-2"></div>
    </div>

    <div class="container">
        <div class="logo-container">
            <img src="assets/images/gobee-logo.png" alt="GoBee Logo" class="logo-img">
        </div>
        <h1>Estamos construindo algo incrível.</h1>
        <p>Prepare-se para uma nova experiência digital. Em breve, a GoBee estará online com soluções completas para
            você.</p>
        <div class="loader"></div>
    </div>

    <div class="footer">
        &copy; 2026 GoBee. Todos os direitos reservados.
    </div>
</body>

</html>
